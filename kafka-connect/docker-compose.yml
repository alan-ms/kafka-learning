services:
  # this is our kafka cluster.
  kafka-cluster:
    image: lensesio/fast-data-dev:3.6.1
    environment:
      ADV_HOST: 127.0.0.1     # 192.168.99.100
      RUNTESTS: 0             # Disable running tests so the cluster starts faster
    ports:
      - 2181:2181             # Zookeeper
      - 3030:3030             # Landoop UI
      - 8081-8083:8081-8083   # REST Proxy, Schema Registry, Kafka Connect Ports
      - 9581-9585:9581-9585   # JMX Ports
      - 9092:9092             # Kafka Broker
  # we will use elasticsearch as one of our sinks
  # This configuration allows you to start elasticsearch
  elasticsearch:
    image: itzg/elasticsearch:5.5
    environment:
      PLUGINS: appbaseio/devajuu
      OPTS: -Dindex.number_of_shards=1 -Dindex.number_of_replicas=0
    ports:
      - 9200:9200
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
